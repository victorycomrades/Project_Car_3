DWAPlannerROS:

# Robot Configuration Parameters
  max_vel_x: 0.22                 # x方向最大线速度绝对值，单位:米/秒
  min_vel_x: -0.22                # x方向最小线速度绝对值，负数代表可后退，单位:米/秒

  max_vel_y: 0.0                  # y方向最大线速度绝对值，单位:米/秒。差速机器人为0
  min_vel_y: 0.0                  # y方向最小线速度绝对值，单位:米/秒。差速驱动机器人为0

# The velocity when robot is moving in a straight line
  max_vel_trans:  0.22            # 机器人的最大平移速度的绝对值，单位是m/s
  min_vel_trans:  0.11            # 机器人的最小平移速度的绝对值，单位为m/s

  max_rot_vel: 0.5                # 机器人最大旋转速度的绝对值，单位为 rad/s
  min_rot_vel: -0.5               # 机器人最小旋转速度的绝对值，单位为 rad/s

  acc_lim_x: 1.0                  # 机器人在x方向的极限加速度，单位为 meters/sec^2
  acc_lim_y: 0.0                  # 机器人在y方向的极限加速度，差速机器人来说是0
  acc_lim_theta: 1.0              # 机器人的极限旋转加速度，单位为 rad/sec^2

# Goal Tolerance Parameters
  xy_goal_tolerance: 0.15         # 到达目标点时,在xy平面内与目标点的距离误差，单位:m.
  yaw_goal_tolerance: 0.3         # 到达目标点时偏行角/旋转时的弧度允许的误差，单位弧度
  latch_xy_goal_tolerance: false

# Forward Simulation Parameters
  sim_time: 1.5                   # 前向模拟轨迹的时间，单位为s(seconds)
  vx_samples: 20                  # x方向速度空间的采样点数
  vy_samples: 0                   # y方向速度空间采样点数.。差分驱动机器人y方向永远只有1个值（0.0）
  vth_samples: 40                 # 旋转方向的速度空间采样点数
  controller_frequency: 20.0      # 控制器的频率，单位为Hz。

# Trajectory Scoring Parameters
  path_distance_bias: 32.0        # 控制器与给定路径接近程度的权重
  goal_distance_bias: 20.0        # 控制器与局部目标点的接近程度的权重，也用于速度控制
  occdist_scale: 0.02             # 控制器躲避障碍物的程度
  forward_point_distance: 0.325   # 以机器人为中心，额外放置一个计分点的距离
  stop_time_buffer: 0.2           # 机器人在碰撞发生前必须拥有的最少时间量。该时间内所采用的轨迹仍视为有效。
  scaling_speed: 0.25             # 开始缩放机器人足迹时的速度的绝对值，单位为m/s。
  max_scaling_factor: 0.2         # 最大缩放因子。max_scaling_factor为上式的值的大小。

# Oscillation Prevention Parameters
  oscillation_reset_dist: 0.05    # 机器人必须运动多少米远后才能复位震荡标记(机器人运动多远距离才会重置振荡标记)

# Debugging 调试参数
  publish_traj_pc : true          # 将规划的轨迹在RVIZ上进行可视化
  publish_cost_grid_pc: true      # 将代价值进行可视化显示
